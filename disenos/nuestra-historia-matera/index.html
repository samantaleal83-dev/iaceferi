<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CEFERÍ — Nuestra historia matera</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px;
      background: #d6cec4;
      color: #5f4a43;
      font-family: "DM Sans", sans-serif;
    }
    h1 {
      margin: 0 0 8px;
      font-family: "Tenor Sans", sans-serif;
      font-size: 32px;
      font-weight: 400;
    }
    p { margin: 0 0 28px; color: #7d736a; }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }
    figure { margin: 0; }
    img { display: block; width: 100%; height: auto; box-shadow: 0 8px 24px #5f4a4320; }
    figcaption { padding-top: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Nuestra historia matera</h1>
  <p>Previsualización del carrusel · 1080 × 1350 px · 4 placas</p>
  <main>
    <figure><img src="01-portada.svg" alt="Portada del carrusel"><figcaption>01 · Portada</figcaption></figure>
    <figure><img src="02-el-origen.svg" alt="Historia matera de CEFERÍ"><figcaption>02 · El origen</figcaption></figure>
    <figure><img src="03-hecho-a-mano.svg" alt="Pieza artesanal hecha a mano"><figcaption>03 · Hecho a mano</figcaption></figure>
    <figure><img src="04-lo-que-viene.svg" alt="Transición hacia los productos de cuero"><figcaption>04 · Lo que viene</figcaption></figure>
  </main>
</body>
</html>
