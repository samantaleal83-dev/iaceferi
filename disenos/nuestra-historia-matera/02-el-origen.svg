<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#f2ece6"/>
  <path d="M72 118h120" stroke="#5f4a43" stroke-width="3"/>
  <text x="72" y="180" fill="#7d736a" font-family="DM Sans, sans-serif" font-size="22" letter-spacing="4">01 — NUESTRO COMIENZO</text>
  <text x="72" y="380" fill="#5f4a43" font-family="Tenor Sans, sans-serif" font-size="76">
    <tspan x="72" dy="0">CEFERÍ empezó</tspan>
    <tspan x="72" dy="95">con el mate.</tspan>
  </text>
  <text x="76" y="650" fill="#5f4a43" font-family="DM Sans, sans-serif" font-size="31">
    <tspan x="76" dy="0">Y con esos objetos que acompañan</tspan>
    <tspan x="76" dy="48">la ronda y la vida cotidiana.</tspan>
  </text>
  <rect x="72" y="820" width="936" height="280" rx="8" fill="#d6cec4"/>
  <text x="112" y="890" fill="#5f4a43" font-family="DM Sans, sans-serif" font-size="23" letter-spacing="3">NUESTRA HISTORIA MATERA</text>
  <text x="112" y="966" fill="#5f4a43" font-family="Tenor Sans, sans-serif" font-size="42">
    <tspan x="112" dy="0">Mates · Bombillas · Yerba</tspan>
    <tspan x="112" dy="60">Yerberas · Materas</tspan>
  </text>
  <text x="72" y="1235" fill="#7d736a" font-family="DM Sans, sans-serif" font-size="22" letter-spacing="2">CEFERÍ · UNA HISTORIA QUE SIGUE</text>
  <text x="1008" y="1235" fill="#7d736a" font-family="DM Sans, sans-serif" font-size="22" text-anchor="end">02 / 04</text>
</svg>
